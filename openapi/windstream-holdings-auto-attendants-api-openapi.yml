openapi: 3.2.0
info:
  title: Windstream Enterprise Voice Auto Attendants API
  description: The Windstream Enterprise Voice API (silhouette) is a REST-based web service with WebSocket support for real-time events. It enables developers to make and receive calls, manage auto-attendants, control call routing, and configure UC (Unified Communications) settings for OfficeSuite UC deployments. The API accepts and delivers content in JSON format and follows HAL (Hypertext Application Language) specifications for resource linking.
  version: 1.0.0
  contact:
    name: Windstream Enterprise Developer Support
    url: https://api.solutions.uniti.com/
  termsOfService: https://www.windstreamenterprise.com/legal/
servers:
- url: https://{webadmin}/api
  description: Voice API server
  variables:
    webadmin:
      default: webadmin.windstreamenterprise.com
      description: WebAdmin server hostname
security:
- basicAuth: []
tags:
- name: auto-attendants
  description: Auto-attendant configuration
paths:
  /auto-attendants:
    get:
      operationId: listAutoAttendants
      summary: List Auto-attendants
      description: Returns a list of all auto-attendants configured in the tenant.
      tags:
      - auto-attendants
      responses:
        '200':
          description: List of auto-attendants
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoAttendant'
    post:
      operationId: createAutoAttendant
      summary: Create Auto-attendant
      description: Creates a new auto-attendant with defined menu options and routing rules.
      tags:
      - auto-attendants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoAttendantCreate'
      responses:
        '201':
          description: Auto-attendant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAttendant'
  /auto-attendants/{attendantId}:
    get:
      operationId: getAutoAttendant
      summary: Get Auto-attendant
      description: Retrieves configuration details of a specific auto-attendant.
      tags:
      - auto-attendants
      parameters:
      - name: attendantId
        in: path
        required: true
        description: Auto-attendant identifier
        schema:
          type: string
      responses:
        '200':
          description: Auto-attendant details
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AutoAttendant'
    put:
      operationId: updateAutoAttendant
      summary: Update Auto-attendant
      description: Updates the configuration of an existing auto-attendant.
      tags:
      - auto-attendants
      parameters:
      - name: attendantId
        in: path
        required: true
        description: Auto-attendant identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoAttendantCreate'
      responses:
        '200':
          description: Auto-attendant updated
    delete:
      operationId: deleteAutoAttendant
      summary: Delete Auto-attendant
      description: Removes an auto-attendant configuration.
      tags:
      - auto-attendants
      parameters:
      - name: attendantId
        in: path
        required: true
        description: Auto-attendant identifier
        schema:
          type: string
      responses:
        '200':
          description: Auto-attendant deleted
components:
  schemas:
    AutoAttendantCreate:
      type: object
      description: Request body for creating or updating an auto-attendant
      required:
      - name
      properties:
        name:
          type: string
          description: Display name
        greeting:
          type: string
          description: Greeting message
        menu_options:
          type: array
          items:
            $ref: '#/components/schemas/MenuOption'
    AutoAttendant:
      type: object
      description: An auto-attendant (IVR) configuration
      properties:
        id:
          type: string
          description: Auto-attendant identifier
        name:
          type: string
          description: Display name
        greeting:
          type: string
          description: Greeting message or audio file path
        menu_options:
          type: array
          description: DTMF menu options
          items:
            $ref: '#/components/schemas/MenuOption'
    MenuOption:
      type: object
      description: A single DTMF menu option
      properties:
        digit:
          type: string
          description: 'DTMF digit (0-9, *, #)'
        action:
          type: string
          description: Action to take when digit is pressed
          enum:
          - transfer
          - voicemail
          - repeat_menu
          - disconnect
        destination:
          type: string
          description: Transfer destination if action is transfer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic Authentication using extension@tenantId credentials. Username formats: ext@tenantId, ext@tenantId.ID, ext@tenantDID.DID, ext@tenantURI.URI'
