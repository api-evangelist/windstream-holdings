openapi: 3.2.0
info:
  title: Windstream Enterprise Voice System API
  description: The Windstream Enterprise Voice API (silhouette) is a REST-based web service with WebSocket support for real-time events. It enables developers to make and receive calls, manage auto-attendants, control call routing, and configure UC (Unified Communications) settings for OfficeSuite UC deployments. The API accepts and delivers content in JSON format and follows HAL (Hypertext Application Language) specifications for resource linking.
  version: 1.0.0
  contact:
    name: Windstream Enterprise Developer Support
    url: https://api.solutions.uniti.com/
  termsOfService: https://www.windstreamenterprise.com/legal/
servers:
- url: https://{webadmin}/api
  description: Voice API server
  variables:
    webadmin:
      default: webadmin.windstreamenterprise.com
      description: WebAdmin server hostname
security:
- basicAuth: []
tags:
- name: system
  description: System-level operations
paths:
  /:
    get:
      operationId: getApiEntryPoint
      summary: Get API Entry Point
      description: Returns the HAL resource entry point with links to available API resources.
      tags:
      - system
      responses:
        '200':
          description: HAL entry point with resource links
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/HalResource'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      description: Error response
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details
    HalResource:
      type: object
      description: HAL (Hypertext Application Language) resource with embedded links
      properties:
        _links:
          type: object
          description: HAL links to related resources
          additionalProperties:
            $ref: '#/components/schemas/HalLink'
    HalLink:
      type: object
      description: HAL link object
      properties:
        href:
          type: string
          description: URL of the linked resource
        title:
          type: string
          description: Human-readable title of the link
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic Authentication using extension@tenantId credentials. Username formats: ext@tenantId, ext@tenantId.ID, ext@tenantDID.DID, ext@tenantURI.URI'
